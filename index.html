<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东南西北 · 随机版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f5e6c8;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(200,170,120,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(180,150,100,0.12) 0%, transparent 50%);
  }

  h1 {
    color: #8b4513;
    font-size: 26px;
    margin-bottom: 6px;
    letter-spacing: 6px;
    font-weight: bold;
  }

  .subtitle {
    color: #b8956a;
    font-size: 12px;
    margin-bottom: 28px;
    letter-spacing: 2px;
  }

  /* ===== 折纸舞台 ===== */
  .stage {
    position: relative;
    width: 300px;
    height: 300px;
    margin-bottom: 30px;
    perspective: 800px;
  }

  .origami {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.3s;
  }

  .flap {
    position: absolute;
    width: 50%;
    height: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    border: 1px solid rgba(0,0,0,0.08);
    transition: transform 0.5s cubic-bezier(0.34, 1.3, 0.64, 1);
    transform-origin: center;
    backface-visibility: hidden;
    overflow: hidden;
  }

  .flap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 50%, rgba(0,0,0,0.08) 100%);
    pointer-events: none;
  }

  .flap-tl { top: 0; left: 0; background: #e74c3c; border-radius: 6px 0 0 0; }
  .flap-tr { top: 0; right: 0; background: #3498db; border-radius: 0 6px 0 0; }
  .flap-bl { bottom: 0; left: 0; background: #f39c12; border-radius: 0 0 0 6px; }
  .flap-br { bottom: 0; right: 0; background: #27ae60; border-radius: 0 0 6px 0; }

  .origami.open .flap-tl { transform: translate(-32%, -32%) rotate(-18deg); }
  .origami.open .flap-tr { transform: translate(32%, -32%) rotate(18deg); }
  .origami.open .flap-bl { transform: translate(-32%, 32%) rotate(18deg); }
  .origami.open .flap-br { transform: translate(32%, 32%) rotate(-18deg); }

  .center-mark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    color: #8b4513;
    z-index: 5;
    pointer-events: none;
    transition: opacity 0.3s;
    font-weight: bold;
  }

  .origami.open .center-mark { opacity: 0; }

  .origami.closed .flap-tl { transform: translate(0, 0); }
  .origami.closed .flap-tr { transform: translate(0, 0); }
  .origami.closed .flap-bl { transform: translate(0, 0); }
  .origami.closed .flap-br { transform: translate(0, 0); }

  @keyframes wobble {
    0%   { transform: rotate(0deg) scale(1); }
    20%  { transform: rotate(10deg) scale(1.03); }
    40%  { transform: rotate(-10deg) scale(1.03); }
    60%  { transform: rotate(8deg) scale(1.02); }
    80%  { transform: rotate(-8deg) scale(1.02); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .origami.wobbling {
    animation: wobble 0.35s ease-in-out;
  }

  @keyframes popOpen {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .origami.pop {
    animation: popOpen 0.35s ease-out;
  }

  /* ===== 控制区 ===== */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 340px;
  }

  .input-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .input-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {
    color: #a08060;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .input-group input,
  .input-group select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid #d4b896;
    background: #fffaf0;
    color: #5a3e2b;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align: center;
    font-weight: bold;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a08060' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
    cursor: pointer;
  }

  .input-group input:focus,
  .input-group select:focus {
    border-color: #e74c3c;
    box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.12);
  }

  .input-group input::placeholder {
    color: #c4a882;
    font-weight: normal;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 4px;
    cursor: pointer;
    background: #e74c3c;
    color: #fff;
    transition: transform 0.12s, box-shadow 0.2s, background 0.2s;
    box-shadow: 0 4px 0 #b03a2e;
  }

  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b03a2e;
  }

  .btn:hover { background: #ec5a4a; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== 音乐按钮 ===== */
  .music-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid #d4b896;
    background: #fffaf0;
    color: #8b6b4a;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(120,90,50,0.15);
    transition: all 0.2s;
    z-index: 200;
  }

  .music-btn:hover {
    border-color: #e74c3c;
    color: #e74c3c;
  }

  .music-btn.playing {
    background: #e74c3c;
    border-color: #e74c3c;
    color: #fff;
    animation: musicPulse 1.5s infinite;
  }

  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 3px 10px rgba(231,76,60,0.3); }
    50% { box-shadow: 0 3px 18px rgba(231,76,60,0.6); }
  }

  /* ===== 结果弹层 ===== */
  .result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60, 40, 20, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
    padding: 24px;
  }

  .result-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .result-card {
    background: #fffaf0;
    border: 2px solid #d4b896;
    border-radius: 16px;
    padding: 32px 26px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    transform: scale(0.6) rotate(-8deg);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 16px 40px rgba(80, 50, 20, 0.25);
    position: relative;
  }

  .result-overlay.show .result-card {
    transform: scale(1) rotate(0deg);
  }

  .result-card::before {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 70px;
    height: 24px;
    background: rgba(231, 76, 60, 0.35);
    border-radius: 2px;
  }

  .result-direction {
    font-size: 52px;
    font-weight: bold;
    color: #e74c3c;
    margin-bottom: 4px;
    line-height: 1;
  }

  .result-steps {
    color: #b8956a;
    font-size: 13px;
    margin-bottom: 18px;
    letter-spacing: 2px;
  }

  .result-divider {
    width: 50px;
    height: 1px;
    background: #d4b896;
    margin: 0 auto 18px;
  }

  .result-text {
    font-size: 22px;
    color: #5a3e2b;
    line-height: 1.6;
    font-weight: bold;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .result-close {
    margin-top: 22px;
    padding: 10px 30px;
    border: 1.5px solid #d4b896;
    border-radius: 30px;
    background: transparent;
    color: #a08060;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }

  .result-close:hover {
    border-color: #e74c3c;
    color: #e74c3c;
    background: rgba(231, 76, 60, 0.05);
  }

  /* ===== 历史 ===== */
  .history {
    margin-top: 22px;
    width: 100%;
    max-width: 340px;
  }

  .history-title {
    color: #b8956a;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-align: center;
  }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .history-item {
    background: #fffaf0;
    border: 1px solid #d4b896;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: #8b6b4a;
    cursor: pointer;
    transition: all 0.2s;
  }

  .history-item:hover {
    border-color: #e74c3c;
    color: #e74c3c;
  }

  /* ===== 闲鱼商品说明区（截图用） ===== */
  .listing-note {
    margin-top: 40px;
    width: 100%;
    max-width: 340px;
    background: #fffaf0;
    border: 1.5px dashed #d4b896;
    border-radius: 12px;
    padding: 20px 18px;
    font-size: 13px;
    color: #8b6b4a;
    line-height: 1.9;
  }

  .listing-note h2 {
    font-size: 15px;
    color: #8b4513;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-align: center;
  }

  .listing-note .highlight {
    color: #e74c3c;
    font-weight: bold;
  }

  .listing-note .divider {
    height: 1px;
    background: #e8d8c0;
    margin: 12px 0;
  }
</style>
</head>
<body>

  <!-- 音乐开关 -->
  <button class="music-btn" id="musicBtn" title="背景音乐">♪</button>

  <h1>东 南 西 北</h1>
  <p class="subtitle">选方向 · 说步数 · 开合看结果</p>

  <div class="stage">
    <div class="origami" id="origami">
      <div class="flap flap-tl">东</div>
      <div class="flap flap-tr">南</div>
      <div class="flap flap-bl">西</div>
      <div class="flap flap-br">北</div>
      <div class="center-mark">?</div>
    </div>
  </div>

  <div class="controls">
    <div class="input-row">
      <div class="input-group">
        <label>方向</label>
        <select id="directionSelect">
          <option value="">请选择</option>
          <option value="东">东</option>
          <option value="南">南</option>
          <option value="西">西</option>
          <option value="北">北</option>
        </select>
      </div>
      <div class="input-group">
        <label>步数</label>
        <select id="stepsSelect">
          <option value="">请选择</option>
          <option value="1">1 下</option>
          <option value="2">2 下</option>
          <option value="3">3 下</option>
          <option value="4">4 下</option>
          <option value="5">5 下</option>
          <option value="6">6 下</option>
          <option value="7">7 下</option>
          <option value="8">8 下</option>
          <option value="9">9 下</option>
          <option value="10">10 下</option>
        </select>
      </div>
    </div>
    <button class="btn" id="playBtn">开 始</button>
  </div>

  <div class="history" id="historyWrap" style="display:none;">
    <div class="history-title">最近结果</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="result-direction" id="resultDirection">东</div>
      <div class="result-steps" id="resultSteps">走了 3 下</div>
      <div class="result-divider"></div>
      <div class="result-text" id="resultText">今晚吃火锅</div>
      <button class="result-close" id="resultClose">再 玩 一 次</button>
    </div>
  </div>

  <!-- 闲鱼商品说明区：截图或录屏时直接用 -->
  <div class="listing-note">
    <h2>—— 商品说明 ——</h2>
    <p>这是一个<span class="highlight">网页版“东南西北”小游戏</span>，打开就能玩，不需要下载 App，不需要注册。</p>
    <div class="divider"></div>
    <p><span class="highlight">玩法：</span>选择方向 → 选择步数（1-10）→ 点“开始”，折纸会按步数开合，最后翻开显示随机内容。</p>
    <p><span class="highlight">特点：</span>每次结果随机，同一个方向、同一步数，每次玩都不一样。</p>
    <p><span class="highlight">内容：</span>内置吃饭选择、小惩罚、小愿望等 30 条，可自定义替换。</p>
    <div class="divider"></div>
    <p><span class="highlight">适用平台：</span>手机电脑都能用。</p>
    <p><span class="highlight">适合场景：</span>家庭聚会、朋友喝酒、班会破冰、情侣日常、直播间互动。</p>
    <div class="divider"></div>
    <p style="text-align:center; color:#b8956a; font-size:12px;">拍前请确认：需要能打开网页的浏览器即可</p>
  </div>

<script>
  // ====== 内容池：每次随机抽一条 ======
  const CONTENT_POOL = [
    "今晚吃火锅", "今晚吃烧烤", "今晚吃饺子", "今晚吃面条",
    "今晚点外卖", "今晚你做饭", "今晚你洗碗", "今晚你请客",
    "学猫叫三声", "做10个深蹲", "唱一首歌", "讲一个笑话",
    "明天早起半小时", "明天不许喝奶茶", "明天走路上班", "明天给家人打电话",
    "这个月存500块", "这个月不买衣服", "这个月读一本书", "这个月学会一道菜",
    "好运+1", "霉运退散", "心想事成", "万事如意",
    "暴富", "脱单", "不挂科", "升职加薪",
    "出门遇贵人", "今天你最大"
  ];

  const origami = document.getElementById("origami");
  const directionSelect = document.getElementById("directionSelect");
  const stepsSelect = document.getElementById("stepsSelect");
  const playBtn = document.getElementById("playBtn");
  const resultOverlay = document.getElementById("resultOverlay");
  const resultDirection = document.getElementById("resultDirection");
  const resultSteps = document.getElementById("resultSteps");
  const resultText = document.getElementById("resultText");
  const resultClose = document.getElementById("resultClose");
  const historyWrap = document.getElementById("historyWrap");
  const historyList = document.getElementById("historyList");
  const musicBtn = document.getElementById("musicBtn");

  let history = [];
  let isPlaying = false;

  // ====== 背景音乐 ======
  // 用 Web Audio API 生成一段轻柔的循环旋律，不需要外部音频文件
  let audioCtx = null;
  let musicTimer = null;
  let musicPlaying = false;

  // 一段简单的五声音阶旋律（C D E G A），循环播放
  const MELODY = [
    { note: 523.25, dur: 0.5 }, // C5
    { note: 587.33, dur: 0.5 }, // D5
    { note: 659.25, dur: 0.5 }, // E5
    { note: 783.99, dur: 0.5 }, // G5
    { note: 659.25, dur: 0.5 }, // E5
    { note: 587.33, dur: 0.5 }, // D5
    { note: 523.25, dur: 0.75 }, // C5
    { note: 0, dur: 0.25 },       // 休止
    { note: 587.33, dur: 0.5 },  // D5
    { note: 659.25, dur: 0.5 },  // E5
    { note: 783.99, dur: 0.5 },  // G5
    { note: 880.00, dur: 0.5 },  // A5
    { note: 783.99, dur: 0.5 },  // G5
    { note: 659.25, dur: 0.5 },  // E5
    { note: 587.33, dur: 0.75 }, // D5
    { note: 0, dur: 0.25 }        // 休止
  ];

  let melodyIndex = 0;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  // 播放一个音符（带柔和包络）
  function playNote(freq, startTime, duration) {
    if (freq === 0) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;

    // 柔和包络：慢慢起，慢慢落
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
    gain.gain.linearRampToValueAtTime(0.06, startTime + duration * 0.5);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  // 循环播放旋律
  function scheduleMelody() {
    if (!musicPlaying) return;

    const now = audioCtx.currentTime;
    let offset = 0;

    // 一次性排完整个旋律
    MELODY.forEach((item) => {
      playNote(item.note, now + offset, item.dur);
      offset += item.dur;
    });

    // 旋律总时长后，再排下一轮
    const totalDur = MELODY.reduce((s, i) => s + i.dur, 0);
    musicTimer = setTimeout(scheduleMelody, totalDur * 1000);
  }

  function toggleMusic() {
    initAudio();
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    if (musicPlaying) {
      // 停止
      musicPlaying = false;
      if (musicTimer) clearTimeout(musicTimer);
      musicBtn.classList.remove("playing");
      musicBtn.textContent = "♪";
    } else {
      // 开始
      musicPlaying = true;
      musicBtn.classList.add("playing");
      musicBtn.textContent = "♫";
      scheduleMelody();
    }
  }

  musicBtn.addEventListener("click", toggleMusic);

  // ====== 游戏逻辑 ======
  function randomContent() {
    const index = Math.floor(Math.random() * CONTENT_POOL.length);
    return CONTENT_POOL[index];
  }

  function validateInput() {
    const dir = directionSelect.value;
    const steps = parseInt(stepsSelect.value, 10);

    if (!dir) {
      directionSelect.style.borderColor = "#e74c3c";
      setTimeout(() => directionSelect.style.borderColor = "", 1000);
      return null;
    }
    if (isNaN(steps) || steps < 1 || steps > 10) {
      stepsSelect.style.borderColor = "#e74c3c";
      setTimeout(() => stepsSelect.style.borderColor = "", 1000);
      return null;
    }
    return { direction: dir, steps };
  }

  function play() {
    if (isPlaying) return;
    const input = validateInput();
    if (!input) return;

    isPlaying = true;
    playBtn.disabled = true;
    playBtn.textContent = "开 合 中...";

    origami.classList.remove("open", "pop");
    origami.classList.add("closed");

    let count = 0;
    const total = input.steps;

    function doWobble() {
      count++;
      origami.classList.remove("wobbling");
      void origami.offsetWidth;
      origami.classList.add("wobbling");

      if (count % 2 === 1) {
        origami.classList.remove("closed");
      } else {
        origami.classList.add("closed");
      }

      if (count < total) {
        setTimeout(doWobble, 380);
      } else {
        setTimeout(() => {
          origami.classList.add("open");
          origami.classList.add("pop");
          origami.classList.remove("closed");

          setTimeout(() => {
            const text = randomContent();
            showResult(input.direction, input.steps, text);
            isPlaying = false;
            playBtn.disabled = false;
            playBtn.textContent = "开 始";
          }, 520);
        }, 380);
      }
    }

    setTimeout(doWobble, 350);
  }

  function showResult(direction, steps, text) {
    resultDirection.textContent = direction;
    resultSteps.textContent = `走了 ${steps} 下`;
    resultText.textContent = text;
    resultOverlay.classList.add("show");

    const label = `${direction}·${steps}下 → ${text}`;
    history.unshift({ direction, steps, text, label });
    if (history.length > 6) history.pop();
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      historyWrap.style.display = "none";
      return;
    }
    historyWrap.style.display = "block";
    historyList.innerHTML = "";
    history.forEach((item) => {
      const el = document.createElement("div");
      el.className = "history-item";
      el.textContent = item.label;
      el.addEventListener("click", () => {
        origami.classList.add("open");
        origami.classList.remove("closed");
        showResult(item.direction, item.steps, item.text);
      });
      historyList.appendChild(el);
    });
  }

  function closeResult() {
    resultOverlay.classList.remove("show");
    setTimeout(() => {
      origami.classList.remove("open", "pop", "closed", "wobbling");
    }, 300);
  }

  playBtn.addEventListener("click", play);
  resultClose.addEventListener("click", closeResult);
  resultOverlay.addEventListener("click", (e) => {
    if (e.target === resultOverlay) closeResult();
  });
</script>
</body>
</html>
